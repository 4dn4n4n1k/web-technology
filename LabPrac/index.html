<!DOCTYPE html>

<html>
    <head>
        <title>Employee Management System</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">
            <h1>Employee Management System</h1>

            <label for="name">Employee Name:</label><br>
            <input type="text" id="name">

            <br><br>

            <label for="id">Employee ID:</label><br>
            <input type="text" id="id">

            <br><br>

            <label for="dept">Employee Department:</label><br>
            <input type="text" id="dept">

            <br><br>

            <label for="salary">Monthly Salary:</label><br>
            <input type="text" id="salary">

            <br><br>

            <button id="generate">Generate Employee Card</button>
            <button id="reset">Reset</button>

            <p id="feedback"></p>

            <div id="card" class="card" style="display: none;">
                <h2>Employee Name</h2>
                <p>Name: <span id="cardName"></span></p>
                <p>ID: <span id="cardId"></span></p>
                <p>Department: <span id="cardDept"></span></p>
                <p>Salary: <span id="cardSalary"></span></p>
                <p>Category: <span id="cardCategory"></span></p>


            </div>

        </div>

        <script src="script.js"></script>
    </body>
</html>
