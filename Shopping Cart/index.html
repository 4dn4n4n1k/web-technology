<!DOCTYPE html>

<html>

    <head>
        <title>Cart | Ecom</title>

        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>

        <h1>Online Shopping Portal</h1>

        <br><br>

        <p id="top">This is an online shopping portal designed using HTML, CSS and JavaScript</p>
        
        <div class="fieldsets">
            <div class="cart">
                <fieldset>
                    <legend>Your Cart:</legend>
                    
                        <label for="">Laptop $399</label>
                        <button id="btnLaptop">Add</button>

                        <br><br>

                        <label for="mac">Mac $299</label>
                        <button id="btnMac">Add</button>

                        <br><br>

                        <label for="iphone">Iphone $199</label>
                        <button id="btnIphone">Add</button> 

                        <br><br>

                        <button id="proceed">Proceed to Checkout</button>
                </fieldset>
            </div>

            <div class="checkout">

                <fieldset>

                    <legend>Checkout:</legend>
                    <p id="result">Total: $0</p>
                    <p></p>
                </fieldset>

            </div>

        </div>

        <script src="script.js"></script>
    </body>
</html>
