<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>

    <div>
        <h1>Sign Up</h1>

        <form>
            <div>
                <label for="fname" class="fname" >First Name:</label>
                <input type="text" id="fname" name="fname" required placeholder="Adnan">
            </div>

            <br>

           <div>
                <label for="lname" class="lname" >Last Name:</label>
                <input type="text" id="lname" name="lname" required placeholder="Anik">
            </div>

            <br>

            <div>
                <label for="email" class="email" >Email:</label>
                <input type="text" id="email" name="email" required placeholder="adnananik@xyz.com">
            </div>

            <br>

            <div>
                <label for="password" class="password" >Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <br>

           <div>
                <label for="cpassword" class="cpassword" >ConfirmPassword:</label>
                <input type="cpassword" id="cpassword" name="cpassword" required>
            </div>

            <br>

            <div>
                <label for="date" class="email" >Date of Birth:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <br>

            <div>
                <label for="gender" class="gender" >Gender:</label>
                <input type="radio" id="Male" name="gender" value="Male">
                <label for="Male">Male</label>
                <input type="radio" id="Female" name="gender" value="Female">
                <label for="Female">Female</label>
            </div>

            <br>

            <div>
                <input type="checkbox" id="terms" name="terms" required>
                <label for ="terms">I agree to the terms & conditions</label>
            </div>

            <br>

            <div>
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
            </div>

        </form>

    </div>

</body>
</html>
