<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="rain-canvas"></canvas>
    <div class="rain-layer"></div>

    <div class="card">

        <div class="card-header">
            <h1>Welcome Back</h1>
            <p>Login to continue to your account</p>
        </div>

        <form class="signup-form">

            <div class="input-group">
                <input type="email" id="email" name="email" required placeholder="Email Address">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </span>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" required placeholder="Password">
                <span class="input-icon toggle-pw" data-target="password">
                    <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </span>
            </div>

            <div class="login-options">
                <label class="checkbox-label login-remember">
                    <input type="checkbox" id="remember" name="remember">
                    <span class="checkbox-custom"></span>
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">Login</button>

            <div class="form-footer">
                <span>Don't have an account? <a href="signup.html">Sign Up</a></span>
            </div>

        </form>
    </div>

    <script>
        /* ── Password toggle ── */
        document.querySelectorAll('.toggle-pw').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                input.type = input.type === 'password' ? 'text' : 'password';
                btn.querySelector('svg').style.opacity = input.type === 'text' ? '1' : '0.45';
            });
        });

        /* ── Canvas rain streaks ── */
        const canvas = document.getElementById('rain-canvas');
        const ctx    = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const ANGLE   = 12 * Math.PI / 180;
        const sinA    = Math.sin(ANGLE);
        const cosA    = Math.cos(ANGLE);
        const streaks = Array.from({ length: 220 }, () => ({
            x:       Math.random() * window.innerWidth,
            y:       Math.random() * window.innerHeight,
            len:     Math.random() * 22 + 10,
            speed:   Math.random() * 12 + 7,
            opacity: Math.random() * 0.35 + 0.07,
            width:   Math.random() < 0.6 ? 0.6 : 1.1,
        }));

        function drawStreaks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            streaks.forEach(s => {
                ctx.save();
                ctx.globalAlpha = s.opacity;
                ctx.strokeStyle = '#d0e8ff';
                ctx.lineWidth   = s.width;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(s.x - s.len * sinA, s.y + s.len * cosA);
                ctx.stroke();
                ctx.restore();

                s.y += s.speed;
                s.x -= s.speed * sinA;

                if (s.y > canvas.height + s.len) {
                    s.y = -s.len;
                    s.x = Math.random() * (canvas.width + 100);
                }
            });
            requestAnimationFrame(drawStreaks);
        }
        drawStreaks();
    </script>

</body>
</html>
