<!doctype html>

<html>
    <head>
        <title>Navigation Bar</title>

        <style>
            *
            {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            nav
            {
                background-color: rgb(0, 0, 150);
                width: 100%;
                display: block;
                text-align: center;
            }

            nav a
            {
                display: inline-block;
                color: white;
                text-decoration: none;
                padding: 16px 24px;
                margin: 0 4px;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 16px;;
            }

            nav a:hover
            {
                background-color: tomato;
                color: white;
            }

        </style>
    </head>

    <body>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
        </nav>
    </body>
</html>
