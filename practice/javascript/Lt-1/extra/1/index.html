<!DOCTYPE html>

<html>
    <head>
        <title>Temperature Convertor</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <div>
            <form onsubmit="convert(); return false;">
                <h2>Temperature Convertor</h2>

                <label for="input">Enter a number:</label>
                <input type="number" id="input">

                <br><br>

                <input type="radio" id="toCelcious" name="conversion">
                <label for="toCelcious">Fahrenheit to Celcious</label>

                <br><br>

                <input type="radio" id="toFahrenheit" name="conversion">
                <label for="toFahrenheit">Celcious to Fahrenheit</label>

                <br><br>

                <button type="submit">Convert</button>
                
                <p id="result"></p>
            </form>
        </div>


        <script src="script.js"></script>
    </body>
</html>
