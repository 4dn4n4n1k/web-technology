<!DOCTYPE html>

<html>
    <head>
        <title>Form Submission</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <form id="signupForm" action="" novalidate>
            <h1>Sign Up</h1>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" autocomplete="given-name">

            <br><br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" autocomplete="family-name">

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" autocomplete="email">

            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" autocomplete="new-password">

            <br><br>

            <label for="cPassword">Confirm password:</label>
            <input type="password" id="cPassword" name="cPassword" autocomplete="new-password">

            <br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">

            <br><br>

            <button type="submit">Submit</button>

            <p id="result"></p>
        </form>
        
        <script src="script.js"></script>
    </body>
</html>
