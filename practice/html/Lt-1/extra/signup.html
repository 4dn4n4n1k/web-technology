<!doctype html>

<html>
    <head>
        <title>Sign up</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Get started...</h1>

        <input type="text" name="fname" id="fname" placeholder="First Name" required>
        <input type="text" name="lname" id="lname" placeholder="Last Name" required><br><br>
        <input type="email" name="email" id="email" placeholder="Email" required><br><br>
        <input type="date" name="bday" id="bday" placeholder="Birthday" required><br><br>
        <input type="password" name="password" id="password" placeholder="New Password" required><br><br>
        <input type="password" name="cpassword" id="cpassword" placeholder="Confirm Password" required><br><br>
        <input type="submit" name="signup" id="signup" value="Sign Up">
    </body>
</html>
